<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <title>PTest API</title>

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-overflow-scrolling: touch;
      background: var(--tg-theme-bg-color, #ffffff);
    }

    /* Safe area uchun (notch, status bar) */
    #app {
      width: 100%;
      height: 100%;
      padding-top: var(--safe-top, 0px);
      padding-bottom: var(--safe-bottom, 0px);
      padding-left: var(--safe-left, 0px);
      padding-right: var(--safe-right, 0px);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    /* Loader */
    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--tg-theme-bg-color, #ffffff);
      z-index: 9999;
      transition: opacity 0.3s;
    }

    #loader.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--tg-theme-hint-color, #ccc);
      border-top-color: var(--tg-theme-button-color, #2481cc);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loader">
    <div class="spinner"></div>
  </div>

  <div id="app">
    <iframe
      id="content"
      src="https://SIZNING-SWAGGER-URL.com/swagger/"
      allow="clipboard-read; clipboard-write"
      onload="document.getElementById('loader').classList.add('hidden')">
    </iframe>
  </div>

  <script>
    (function() {
      const tg = window.Telegram?.WebApp;

      if (!tg) {
        console.warn('Telegram WebApp SDK topilmadi');
        return;
      }

      // 1. SDK'ni initsializatsiya qilish
      tg.ready();

      // 2. To'liq balandlikka kengaytirish
      tg.expand();

      // 3. ENG MUHIMI — pastga swipe'ni o'chirish (Bot API 7.7+)
      if (typeof tg.disableVerticalSwipes === 'function') {
        tg.disableVerticalSwipes();
      }

      // 4. Fullscreen rejim (Bot API 8.0+) — ixtiyoriy
      if (typeof tg.requestFullscreen === 'function') {
        try {
          tg.requestFullscreen();
        } catch (e) {
          console.log('Fullscreen mavjud emas:', e);
        }
      }

      // 5. Yopish tasdiqi (foydalanuvchi tasodifan yopib yubormasligi uchun)
      if (typeof tg.enableClosingConfirmation === 'function') {
        tg.enableClosingConfirmation();
      }

      // 6. Safe area inset'larini boshqarish (notch, status bar uchun)
      function applySafeArea() {
        const inset = tg.safeAreaInset || {};
        const contentInset = tg.contentSafeAreaInset || {};
        const root = document.documentElement;
        
        root.style.setProperty('--safe-top', (inset.top || contentInset.top || 0) + 'px');
        root.style.setProperty('--safe-bottom', (inset.bottom || contentInset.bottom || 0) + 'px');
        root.style.setProperty('--safe-left', (inset.left || contentInset.left || 0) + 'px');
        root.style.setProperty('--safe-right', (inset.right || contentInset.right || 0) + 'px');
      }

      applySafeArea();

      // Safe area o'zgarganda qayta hisoblash
      tg.onEvent('safeAreaChanged', applySafeArea);
      tg.onEvent('contentSafeAreaChanged', applySafeArea);
      tg.onEvent('fullscreenChanged', applySafeArea);

      // 7. Tema ranglarini Telegram'dan olish
      function applyTheme() {
        const theme = tg.themeParams || {};
        const root = document.documentElement;
        
        Object.keys(theme).forEach(key => {
          root.style.setProperty(`--tg-theme-${key.replace(/_/g, '-')}`, theme[key]);
        });
      }

      applyTheme();
      tg.onEvent('themeChanged', applyTheme);

      // 8. iOS'da bounce/elastic scroll'ni qo'shimcha o'chirish
      document.addEventListener('touchmove', function(e) {
        if (e.target === document.body || e.target === document.documentElement) {
          e.preventDefault();
        }
      }, { passive: false });

      // Tashxis uchun — versiyani konsolga chiqarish
      console.log('Telegram WebApp version:', tg.version);
      console.log('Platform:', tg.platform);
      console.log('isFullscreen:', tg.isFullscreen);
    })();
  </script>
</body>
</html>
